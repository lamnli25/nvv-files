version: "3.8"

services:
  traefik:
    image: traefik:v2.13
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=nli-adm@nvv.de"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/vaultwarden/traefik:/letsencrypt
    user: "1001:1002"
    

  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: nvv-vaultwarden
    restart: always
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: "KGCh6d^WGro$yH*R@$u!@eGCWRf%ZeW@oSzW&hdY&yGLBxpZKZQV3WAY^cU6jg4!2#xTLzfz%c8%4ZpjetgH#f^Re4H9NV2#*K&2Jn$9yTb7ottGb@Z9tAihL2vYEgPs"
      TZ: "Europe/Berlin"
      LOG_FILE: "/data/vaultwarden.log"
      LOG_LEVEL: "warn"
    volumes:
      - /mnt/vaultwarden/vw-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    user: "1001:1002"
    networks:
	- dockertoproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.nvv.de`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=le"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

networks:
	dockertoproxy:
		external: true
